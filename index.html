<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compteurs Mignons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(to right, #ffe4e1, #ffb6c1);
            color: #333;
            text-align: center;
        }
        .counter {
            margin: 20px;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .counter h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .counter p {
            font-size: 36px;
            margin: 0;
            color: #ff1493;
        }
    </style>
</head>
<body>
<div class="counter">
    <h1>Jours écoulés depuis le 29 novembre 2024 :</h1>
    <p id="increment-counter">0</p>
</div>
<div class="counter">
    <h1>Jours restants jusqu'au 13 décembre 2024 :</h1>
    <p id="decrement-counter">0</p>
</div>

<script>
    // Dates de référence
    const startDate = new Date("2024-11-29");
    const endDate = new Date("2024-12-13");

    // Fonction pour mettre à jour les compteurs
    function updateCounters() {
        const now = new Date();

        // Calcul du compteur incrémenté
        const timeSinceStart = Math.floor((now - startDate) / (1000 * 60 * 60 * 24));
        document.getElementById("increment-counter").textContent = Math.max(timeSinceStart, 0);

        // Calcul du compteur décrémenté
        const timeUntilEnd = Math.ceil((endDate - now) / (1000 * 60 * 60 * 24));
        document.getElementById("decrement-counter").textContent = Math.max(timeUntilEnd, 0);
    }

    // Met à jour les compteurs toutes les secondes
    setInterval(updateCounters, 1000);
    updateCounters();
</script>
</body>
</html>
